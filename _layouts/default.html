<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
{% seo %}
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
<div class="wrap">
<header>
  <a class="name" href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <nav>
    <a href="#about">About</a>
    <a href="#research">Research</a>
    <a href="#publications">Publications</a>
    <a href="{{ '/cv.pdf' | relative_url }}">CV</a>
  </nav>
</header>

{{ content }}

<footer>
  <div>
    <span class="label">Contact</span>
    <a href="mailto:{{ site.email }}">{{ site.email }}</a>
  </div>
  <div>
    <span class="label">Follow</span>
    <a href="https://github.com/{{ site.github }}">GitHub</a>
    <a href="https://www.linkedin.com/in/{{ site.linkedin }}/">LinkedIn</a>
    <a href="{{ '/cv.pdf' | relative_url }}">CV (PDF)</a>
  </div>
  <div><span class="label">Updated</span>{{ site.time | date: "%B %Y" }}</div>
</footer>
</div>
</body>
</html>
